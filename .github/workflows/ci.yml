name: CI

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# PRs: one active run per PR; cancel superseded runs.
# main / workflow_dispatch: group by commit SHA so a new push does not cancel an in-flight main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SmartEnum.slnx

      - name: Build (Release)
        run: dotnet build SmartEnum.slnx -c Release --no-restore

      - name: Test Core
        run: dotnet test tests/unit/SmartEnum.Tests/SmartEnum.Tests.csproj -c Release --no-build

      - name: Test Generator
        run: dotnet test tests/generators/SmartEnum.Generators.Tests/SmartEnum.Generators.Tests.csproj -c Release --no-build

      - name: Test Generator Integration
        run: dotnet test tests/integration/SmartEnum.Generator.IntegrationTests/SmartEnum.Generator.IntegrationTests.csproj -c Release --no-build

      - name: Test NuGet Package Integration
        run: dotnet test tests/integration/SmartEnum.Package.IntegrationTests/SmartEnum.Package.IntegrationTests.csproj -c Release --no-build
